# GitHub Actions are pinned to immutable commit SHAs; Dependabot keeps the pins up to date.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.6 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Install xcodegen
        run: brew list xcodegen || brew install --quiet xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS 26 SDK)
        run: |
          xcodebuild -project LootList.xcodeproj \
            -scheme LootList \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=-

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install lint tools
        run: brew install swiftlint swiftformat

      - name: SwiftFormat lint
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint
