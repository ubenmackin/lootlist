# GitHub Actions are pinned to immutable commit SHAs; Dependabot keeps the pins up to date.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 4 * * 4'

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # No separate Xcode setup needed for build-mode: none - analysis does not compile.
    # CI job (macos-26 / Xcode 26.6) already proves the iOS 26 build.

    # Initializes CodeQL tools for scanning (Swift build-mode: none - no xcodebuild, avoids tracer hang)
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: swift
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        category: "/language:swift"
