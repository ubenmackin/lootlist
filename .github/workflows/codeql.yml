# GitHub Actions are pinned to immutable commit SHAs; Dependabot keeps the pins up to date.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 4 * * 4'

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Xcode 26.6 (iOS 26 SDK)
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '26.6'

    - name: Install xcodegen and generate project
      run: |
        brew list xcodegen || brew install --quiet xcodegen
        xcodegen generate

    # Swift does not support build-mode: none (requires autobuild or manual).
    # Use autobuild with Xcode 26.6 on macos-26; CI already proves the build,
    # so this avoids duplicating the manual xcodebuild hang (codeql#22121).
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: swift
        build-mode: autobuild

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        category: "/language:swift"
