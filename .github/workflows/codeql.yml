# GitHub Actions are pinned to immutable commit SHAs; Dependabot keeps the pins up to date.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '24 4 * * 4'

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Select Latest Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-

    # Initializes CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        languages: swift
        build-mode: manual

    # Build step using generic destination (avoids simulator daemon hangs)
    - name: Build Swift Code
      run: |
        xcodebuild -project LootList.xcodeproj \
          -scheme LootList \
          -destination 'generic/platform=iOS' \
          build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY=-

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      with:
        category: "/language:swift"
